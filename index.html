function details(p){$('title').textContent=p.name;$('facts').replaceChildren();for(const [k,v] of [['柜点','测试点1'],['柜门编号',p.slot],['演示价格','HK$ '+p.price],['成色',p.condition]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;$('facts').append(dt,dd)}$('detailText').textContent=p.detail+' 仅供演示，不能实际购买或开启柜门。';$('sellerName').textContent=p.seller;$('email').textContent=p.email;$('email').href='mailto:'+p.email;contact=p.email;$('copyStatus').textContent='';$('dialog').showModal();window.openProductModel(p.slot)}
marker.onclick=()=>{$('heading').textContent='测试点1 · 正在寄售';$('items').replaceChildren();goods.forEach(p=>{const a=document.createElement('article');a.className='card';const t=document.createElement('span');t.className='tag';t.textContent='演示商品 · '+p.slot;const h=document.createElement('h3');h.textContent=p.name;const pr=document.createElement('div');pr.className='price';pr.textContent='HK$ '+p.price;const d=document.createElement('p');d.textContent=p.condition+' · '+p.detail;const btn=document.createElement('button');btn.className='secondary';btn.textContent='查看详情与卖家';btn.onclick=()=>details(p);a.append(t,h,pr,d,btn);$('items').append(a)});marker.setAttribute('aria-expanded','true');if(innerWidth<850)$('inventory').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(contact);$('copyStatus').textContent='已复制演示邮箱。'}catch(e){$('copyStatus').textContent='无法自动复制，请长按或选中上方邮箱手动复制。'}};$('close').onclick=()=>$('dialog').close();
$('reset').onclick=()=>{pos={x:42,y:62};paint();try{localStorage.setItem('campus-map-image-point-v1',JSON.stringify(pos))}catch(e){}status('已恢复初始示意位置。')};function scale(d){zoom=Math.max(100,Math.min(300,zoom+d));map.style.width=zoom+'%';status('地图缩放：'+zoom+'%，可滚动查看。')}$('zin').onclick=()=>scale(50);$('zout').onclick=()=>scale(-50);
</script><script>
(()=>{
const models={A01:{file:'table_fan.glb',name:'桌面循环风扇'},A02:{file:'desk_lamp.glb',name:'LED护眼台灯'},A03:{file:'rice_cooker.glb',name:'迷你电饭煲'}};
const viewer=document.getElementById('productViewer'),msg=document.getElementById('product3dStatus'),rotate=document.getElementById('productRotate'),credit=document.getElementById('modelCredit');let active=null,loaded=false,loading=false;
function viewReset(){viewer.setAttribute('camera-orbit','35deg 70deg auto');viewer.setAttribute('camera-target','auto auto auto');viewer.setAttribute('field-of-view','auto');if(viewer.jumpCameraToGoal)viewer.jumpCameraToGoal()}
function loadModel(retry=false){if(!active)return;if(window.productComponentFailed){msg.textContent='3D组件加载失败，请检查网络后刷新；商品信息仍可查看。';return}loading=true;loaded=false;msg.textContent='正在加载'+active.name+'模型…';viewer.setAttribute('alt',active.name+'三维展示模型');viewer.setAttribute('src','./'+active.file+(retry?'?reload='+Date.now():''))}
function setCredit(slot){credit.replaceChildren();if(slot!=='A03'){credit.textContent='请按实际上传模型的许可保留作者与来源；风扇和台灯文件尚未核验。';return}credit.append(document.createTextNode('模型：Rice cooker，作者 prasetyoheru10，许可 CC BY 4.0。'));let a=document.createElement('a');a.href='https://sketchfab.com/3d-models/rice-cooker-9f470c0b1320441c850ffe0d6095b998';a.target='_blank';a.rel='noopener';a.textContent='查看模型来源';credit.append(a);credit.append(document.createTextNode('（适用于你提供许可的该模型；更换模型后请更新署名。）'))}
window.openProductModel=slot=>{const next=models[slot];if(!next)return;const changed=!active||active.file!==next.file;active=next;setCredit(slot);viewer.setAttribute('auto-rotate','');rotate.textContent='暂停旋转';viewReset();if(changed||(!loaded&&!loading))loadModel();else if(loaded)msg.textContent='模型已加载，可拖动旋转查看。'};
viewer.addEventListener('load',()=>{loaded=true;loading=false;msg.textContent='模型已加载，可拖动旋转查看。'});viewer.addEventListener('error',()=>{loading=false;loaded=false;msg.textContent='模型读取失败：请确认 '+(active?active.file:'GLB文件')+' 与 index.html 在同一发布目录，文件名和大小写一致，部署已完成，且GLB文件有效。'});
rotate.onclick=()=>{let running=viewer.hasAttribute('auto-rotate');viewer.toggleAttribute('auto-rotate',!running);rotate.textContent=running?'自动旋转':'暂停旋转'};document.getElementById('productReset').onclick=viewReset;document.getElementById('productRetry').onclick=()=>loadModel(true);document.getElementById('dialog').addEventListener('close',()=>viewer.removeAttribute('auto-rotate'));
})();</script></html>
